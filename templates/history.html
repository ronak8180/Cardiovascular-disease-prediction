<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction History - Heart Disease Prediction System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <nav class="main-nav">
            <div class="nav-brand">
                <i class="fas fa-heartbeat"></i>
                <span>HeartAI</span>
            </div>
            <div class="nav-links">
                <a href="/dashboard" class="nav-link">
                    <i class="fas fa-tachometer-alt"></i>
                    Dashboard
                </a>
                <a href="/predict" class="nav-link">
                    <i class="fas fa-calculator"></i>
                    Predict
                </a>
                <a href="/history" class="nav-link active">
                    <i class="fas fa-history"></i>
                    History
                </a>
                <a href="/about" class="nav-link">
                    <i class="fas fa-info-circle"></i>
                    About
                </a>
            </div>
        </nav>

        <!-- History Header -->
        <header class="history-header">
            <h1><i class="fas fa-chart-line"></i> Prediction History</h1>
            <p>Track your heart disease risk over time and monitor your health progress</p>
        </header>

        <!-- Filter and Search -->
        <div class="history-controls">
            <div class="filter-section">
                <div class="filter-group">
                    <label for="dateFilter">Date Range:</label>
                    <select id="dateFilter" onchange="filterHistory()">
                        <option value="all">All Time</option>
                        <option value="week">Last Week</option>
                        <option value="month">Last Month</option>
                        <option value="3months">Last 3 Months</option>
                        <option value="year">Last Year</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="riskFilter">Risk Level:</label>
                    <select id="riskFilter" onchange="filterHistory()">
                        <option value="all">All Risk Levels</option>
                        <option value="low">Low Risk</option>
                        <option value="medium">Medium Risk</option>
                        <option value="high">High Risk</option>
                    </select>
                </div>
                
            </div>
            
            <div class="export-section">
                <button class="export-btn" onclick="exportHistory()">
                    <i class="fas fa-download"></i>
                    Export Data
                </button>
            </div>
        </div>

        <!-- Statistics Summary -->
        <div class="history-stats">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-chart-bar"></i>
                </div>
                <div class="stat-content">
                    <h3 id="totalHistory">0</h3>
                    <p>Total Predictions</p>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-arrow-down"></i>
                </div>
                <div class="stat-content">
                    <h3 id="avgRisk">0%</h3>
                    <p>Average Risk</p>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-trending-up"></i>
                </div>
                <div class="stat-content">
                    <h3 id="trend">-</h3>
                    <p>Risk Trend</p>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-calendar-check"></i>
                </div>
                <div class="stat-content">
                    <h3 id="lastPrediction">-</h3>
                    <p>Last Prediction</p>
                </div>
            </div>
        </div>

        <!-- Trend Chart -->
        <div class="trend-chart-section">
            <h3><i class="fas fa-chart-line"></i> Risk Trend Over Time</h3>
            <div class="chart-container">
                <canvas id="trendChart"></canvas>
            </div>
        </div>

        <!-- Predictions List -->
        <div class="predictions-section">
            <div class="section-header">
                <h3><i class="fas fa-list"></i> Prediction Records</h3>
                <div class="view-toggle">
                    <button class="toggle-btn active" onclick="toggleView('list')">
                        <i class="fas fa-list"></i>
                    </button>
                    <button class="toggle-btn" onclick="toggleView('grid')">
                        <i class="fas fa-th"></i>
                    </button>
                </div>
            </div>
            
            <div class="predictions-container" id="predictionsContainer">
                <!-- Predictions will be loaded here -->
            </div>
        </div>

        <!-- Detailed View Modal -->
        <div id="detailModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Prediction Details</h3>
                    <button class="close-btn" onclick="closeModal()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body" id="modalBody">
                    <!-- Detailed prediction info will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let historyData = [];
        let filteredData = [];
        let currentView = 'list';

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            initializeHistory();
            fetchHistory();
        });

        function initializeHistory() {
            // Animate stats cards
            anime({
                targets: '.stat-card',
                translateY: [50, 0],
                opacity: [0, 1],
                duration: 800,
                delay: anime.stagger(100),
                easing: 'easeOutExpo'
            });

            // Animate chart
            anime({
                targets: '.chart-container',
                translateY: [50, 0],
                opacity: [0, 1],
                duration: 800,
                delay: 300,
                easing: 'easeOutExpo'
            });
        }

        async function fetchHistory() {
            try {
                const res = await fetch('/api/history');
                const data = await res.json();
                historyData = Array.isArray(data.items) ? data.items : [];
                filteredData = [...historyData];
                updateStatistics();
                renderPredictions();
                createTrendChart();
            } catch (e) {
                console.error('Failed to load history', e);
            }
        }

        function loadHistoryData() {
            updateStatistics();
            renderPredictions();
        }

        function updateStatistics() {
            const total = filteredData.length;
            const avgRisk = filteredData.reduce((sum, pred) => sum + pred.probability, 0) / total;
            const lastPrediction = filteredData.length > 0 ? filteredData[0].date : 'None';
            
            // Calculate trend
            let trend = '-';
            if (filteredData.length >= 2) {
                const recent = filteredData.slice(0, 3).reduce((sum, pred) => sum + pred.probability, 0) / 3;
                const older = filteredData.slice(-3).reduce((sum, pred) => sum + pred.probability, 0) / 3;
                if (recent < older) trend = '↓ Improving';
                else if (recent > older) trend = '↑ Increasing';
                else trend = '→ Stable';
            }

            // Update DOM
            document.getElementById('totalHistory').textContent = total;
            document.getElementById('avgRisk').textContent = avgRisk.toFixed(1) + '%';
            document.getElementById('trend').textContent = trend;
            document.getElementById('lastPrediction').textContent = lastPrediction;
        }

        function renderPredictions() {
            const container = document.getElementById('predictionsContainer');
            
            if (currentView === 'list') {
                container.innerHTML = filteredData.map(pred => `
                    <div class="prediction-item ${pred.status}" onclick="showDetails(${pred.id})">
                        <div class="prediction-date">
                            <div class="date">${pred.date}</div>
                            <div class="time">${pred.time}</div>
                        </div>
                        <div class="prediction-risk">
                            <span class="risk-badge ${pred.status}">${pred.risk} Risk</span>
                        </div>
                        <div class="prediction-probability">
                            <span class="probability">${pred.probability}%</span>
                        </div>
                        <div class="prediction-factors">
                            <div class="factor-tags">
                                <span class="factor-tag">${pred.factors.age}</span>
                                <span class="factor-tag">${pred.factors.bmi}</span>
                                <span class="factor-tag">${pred.factors.exercise}</span>
                            </div>
                        </div>
                        <div class="prediction-actions">
                            <button class="action-btn" onclick="event.stopPropagation(); showDetails(${pred.id})">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button class="action-btn" onclick="event.stopPropagation(); exportPrediction(${pred.id})">
                                <i class="fas fa-download"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            } else {
                container.innerHTML = filteredData.map(pred => `
                    <div class="prediction-card ${pred.status}" onclick="showDetails(${pred.id})">
                        <div class="card-header">
                            <div class="card-date">${pred.date}</div>
                            <div class="card-time">${pred.time}</div>
                        </div>
                        <div class="card-body">
                            <div class="card-risk">
                                <span class="risk-badge ${pred.status}">${pred.risk} Risk</span>
                            </div>
                            <div class="card-probability">
                                <span class="probability">${pred.probability}%</span>
                            </div>
                            <div class="card-factors">
                                <div class="factor-item">
                                    <i class="fas fa-user"></i>
                                    <span>${pred.factors.age}</span>
                                </div>
                                <div class="factor-item">
                                    <i class="fas fa-weight"></i>
                                    <span>${pred.factors.bmi}</span>
                                </div>
                                <div class="factor-item">
                                    <i class="fas fa-running"></i>
                                    <span>${pred.factors.exercise}</span>
                                </div>
                            </div>
                        </div>
                        <div class="card-actions">
                            <button class="action-btn" onclick="event.stopPropagation(); showDetails(${pred.id})">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            // Animate predictions
            anime({
                targets: currentView === 'list' ? '.prediction-item' : '.prediction-card',
                translateY: [30, 0],
                opacity: [0, 1],
                duration: 600,
                delay: anime.stagger(50),
                easing: 'easeOutExpo'
            });
        }

        function createTrendChart() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            const dates = filteredData.map(pred => pred.date).reverse();
            const probabilities = filteredData.map(pred => pred.probability).reverse();
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [{
                        label: 'Heart Disease Risk (%)',
                        data: probabilities,
                        borderColor: '#0ea5e9',
                        backgroundColor: 'rgba(14, 165, 233, 0.15)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#0ea5e9',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            grid: {
                                color: 'rgba(0,0,0,0.1)'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            }
                        }
                    },
                    animation: {
                        duration: 2000,
                        easing: 'easeOutExpo'
                    }
                }
            });
        }

        function filterHistory() {
            const dateFilter = document.getElementById('dateFilter').value;
            const riskFilter = document.getElementById('riskFilter').value;
            
            filteredData = mockHistoryData.filter(pred => {
                let dateMatch = true;
                let riskMatch = true;
                
                // Date filter
                if (dateFilter !== 'all') {
                    const predDate = new Date(pred.date);
                    const now = new Date();
                    const diffTime = Math.abs(now - predDate);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    
                    switch (dateFilter) {
                        case 'week':
                            dateMatch = diffDays <= 7;
                            break;
                        case 'month':
                            dateMatch = diffDays <= 30;
                            break;
                        case '3months':
                            dateMatch = diffDays <= 90;
                            break;
                        case 'year':
                            dateMatch = diffDays <= 365;
                            break;
                    }
                }
                
                // Risk filter
                if (riskFilter !== 'all') {
                    riskMatch = pred.risk.toLowerCase() === riskFilter;
                }
                
                return dateMatch && riskMatch;
            });
            
            loadHistoryData();
            createTrendChart();
        }

        function searchHistory() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            if (searchTerm === '') {
                filteredData = [...historyData];
            } else {
                filteredData = historyData.filter(pred => 
                    pred.date.includes(searchTerm) ||
                    pred.risk.toLowerCase().includes(searchTerm) ||
                    pred.probability.toString().includes(searchTerm)
                );
            }
            
            loadHistoryData();
            createTrendChart();
        }

        function toggleView(view) {
            currentView = view;
            
            // Update toggle buttons
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.toggle-btn').classList.add('active');
            
            renderPredictions();
        }

        function showDetails(id) {
            const prediction = historyData[id] || historyData.find(p => p.id === id) || filteredData.find(p => p.id === id) || null;
            const modal = document.getElementById('detailModal');
            const modalBody = document.getElementById('modalBody');
            
            modalBody.innerHTML = `
                <div class="detail-section">
                    <h4>Prediction Information</h4>
                    <div class="detail-grid">
                        <div class="detail-item">
                            <label>Date:</label>
                            <span>${prediction.date} at ${prediction.time}</span>
                        </div>
                        <div class="detail-item">
                            <label>Risk Level:</label>
                            <span class="risk-badge ${prediction.status}">${prediction.risk} Risk</span>
                        </div>
                        <div class="detail-item">
                            <label>Probability:</label>
                            <span>${prediction.probability}%</span>
                        </div>
                    </div>
                </div>
                
                <div class="detail-section">
                    <h4>Health Factors</h4>
                    <div class="factors-grid">
                        <div class="factor-detail">
                            <i class="fas fa-user"></i>
                            <div>
                                <label>Age Category:</label>
                                <span>${prediction.factors.age}</span>
                            </div>
                        </div>
                        <div class="factor-detail">
                            <i class="fas fa-weight"></i>
                            <div>
                                <label>BMI Category:</label>
                                <span>${prediction.factors.bmi}</span>
                            </div>
                        </div>
                        <div class="factor-detail">
                            <i class="fas fa-running"></i>
                            <div>
                                <label>Exercise:</label>
                                <span>${prediction.factors.exercise}</span>
                            </div>
                        </div>
                        <div class="factor-detail">
                            <i class="fas fa-ban-smoking"></i>
                            <div>
                                <label>Smoking:</label>
                                <span>${prediction.factors.smoking}</span>
                            </div>
                        </div>
                        <div class="factor-detail">
                            <i class="fas fa-heartbeat"></i>
                            <div>
                                <label>Diabetes:</label>
                                <span>${prediction.factors.diabetes}</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="detail-actions">
                    <button class="btn-primary" onclick="exportPrediction(${prediction.id})">
                        <i class="fas fa-download"></i>
                        Export This Prediction
                    </button>
                </div>
            `;
            
            modal.style.display = 'block';
            
            // Animate modal
            anime({
                targets: modal,
                opacity: [0, 1],
                duration: 300,
                easing: 'easeOutExpo'
            });
        }

        function closeModal() {
            const modal = document.getElementById('detailModal');
            anime({
                targets: modal,
                opacity: [1, 0],
                duration: 300,
                easing: 'easeInExpo',
                complete: () => modal.style.display = 'none'
            });
        }

        function exportHistory() {
            // Export all predictions as CSV
            const csvRows = [];
            const headers = [
                'Date', 'Time', 'Risk', 'Probability', 'Status', 'Age', 'BMI', 'Exercise', 'Smoking', 'Diabetes'
            ];
            csvRows.push(headers.join(','));
            historyData.forEach(pred => {
                csvRows.push([
                    pred.date,
                    pred.time,
                    pred.risk,
                    pred.probability,
                    pred.status,
                    pred.factors.age,
                    pred.factors.bmi,
                    pred.factors.exercise,
                    pred.factors.smoking,
                    pred.factors.diabetes
                ].map(val => `"${val}"`).join(','));
            });
            const csvContent = csvRows.join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'prediction_history.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function exportPrediction(id) {
            // Export single prediction as PDF
            const pred = historyData.find(p => p.id === id) || filteredData.find(p => p.id === id);
            if (!pred) {
                alert('Prediction not found!');
                return;
            }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(18);
            doc.text('Heart Disease Prediction Report', 10, 15);
            doc.setFontSize(12);
            doc.text(`Date: ${pred.date}   Time: ${pred.time}`, 10, 30);
            doc.text(`Risk Level: ${pred.risk}`, 10, 40);
            doc.text(`Probability: ${pred.probability}%`, 10, 50);
            doc.text(`Status: ${pred.status}`, 10, 60);
            doc.text('Health Factors:', 10, 75);
            let y = 85;
            Object.entries(pred.factors).forEach(([key, value]) => {
                doc.text(`${key}: ${value}`, 15, y);
                y += 10;
            });
            doc.save(`prediction_${id}.pdf`);
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('detailModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
